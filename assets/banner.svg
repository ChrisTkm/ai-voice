      <stop stop-color="#0f1115"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b1f27" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#11141a" stop-opacity="0.98"/>
